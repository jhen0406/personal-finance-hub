# 本機開發與整合測試用的 Postgres（正式環境為 Neon，版本保持一致）
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pfh
      POSTGRES_PASSWORD: pfh
      POSTGRES_DB: pfh
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfh"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
